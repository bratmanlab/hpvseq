outdir: "/cluster/projects/scottgroup/people/jinfeng/HPV-seq/VENUS_full_test/results"

# Pre-QC
index_mismatch: 0
key_pool: true
pool_delim: "_"
index: "/cluster/projects/scottgroup/people/jinfeng/HPV-seq/VENUS_full_test/i7_i5revcomp" 
library: "/cluster/projects/scottgroup/people/jinfeng/HPV-seq/VENUS_full_test/lib.txt"

# Sample type
baseline_name: "BASELINE"
buffycoat_name: "BC"

# Preparation 
